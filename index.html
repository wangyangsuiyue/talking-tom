<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<title>会说话的汤姆猫 - Talking Tom 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #101418; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { width: 100%; height: 100%; position: relative; }

  /* 加载遮罩 */
  #loader {
    position: absolute; inset: 0; z-index: 100;
    background: #101418; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    transition: opacity .6s ease; color: #dfe7ee;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .paw { font-size: 48px; animation: bounce 1s infinite ease-in-out; }
  @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-14px);} }
  #loader .bar { width: 220px; height: 6px; background: #232a33; border-radius: 3px; overflow: hidden; }
  #loader .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#f7a94a,#ff6b6b); border-radius: 3px; transition: width .2s; }
  #loader .txt { font-size: 13px; color: #8fa0b3; letter-spacing: 2px; }

  /* 顶部标题 */
  #title {
    position: absolute; top: 18px; left: 0; right: 0; text-align: center; z-index: 10;
    color: #fff; pointer-events: none;
  }
  #title h1 { font-size: 22px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 26px rgba(0,0,0,.75); }
  #title p { font-size: 12px; color: #c8d7e5; margin-top: 4px; text-shadow: 0 1px 6px rgba(0,0,0,.95); }

  /* 两侧按钮面板 */
  .side-panel {
    position: absolute; top: 52%; transform: translateY(-50%);
    z-index: 10; display: flex; flex-direction: column; gap: 14px;
  }
  #panel-left { left: 24px; }
  #panel-right { right: 24px; }

  .side-panel button {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 11px 18px; font-size: 14px; font-weight: 500;
    color: #fff; cursor: pointer;
    background: rgba(16,20,24,.72); border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px; backdrop-filter: blur(12px);
    transition: all .2s cubic-bezier(.175,.885,.32,1.275);
    box-shadow: 0 6px 18px rgba(0,0,0,.35); white-space: nowrap;
    user-select: none; -webkit-user-select: none;
  }
  .side-panel button:hover {
    transform: translateY(-2px) scale(1.06);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    filter: brightness(1.12);
  }
  .side-panel button:active {
    transform: scale(0.96);
  }

  /* 提示 */
  #hint {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 12px; color: #b9c9d8; text-shadow: 0 1px 6px rgba(0,0,0,.95); pointer-events: none;
    opacity: 1; transition: opacity 1s; white-space: nowrap;
  }
  #hint.fade { opacity: 0; }

  /* 对话气泡 */
  #bubble {
    position: absolute; top: 110px; left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff; color: #333; padding: 10px 18px; border-radius: 16px;
    font-size: 15px; z-index: 20; pointer-events: none;
    transition: transform .22s cubic-bezier(.68,-0.55,.27,1.55);
    box-shadow: 0 4px 16px rgba(0,0,0,.35); white-space: nowrap;
  }
  #bubble.show { transform: translateX(-50%) scale(1); }
  #bubble::after {
    content: ''; position: absolute; bottom: -8px; left: 50%; margin-left: -8px;
    border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
  }

  /* 点击打击特效 */
  .hit-fx {
    position: absolute; z-index: 30; pointer-events: none; font-size: 28px;
    animation: hitfly .8s ease-out forwards; will-change: transform, opacity;
  }
  @keyframes hitfly {
    0%   { transform: translate(-50%, -50%) scale(.4) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5) rotate(var(--rot)); opacity: 0; }
  }

  /* 屏幕轻微震动（被打时） */
  #app.shake { animation: shake .3s linear; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(5px, -4px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(3px, 4px); }
  }

  canvas { display: block; }

  /* 右上角音效开关 */
  #sound-toggle {
    position: absolute; top: 16px; right: 18px; z-index: 20;
    width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    font-size: 17px; line-height: 1; color: #e8eef4;
    background: rgba(16,20,24,.62); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(10px); transition: all .15s;
  }
  #sound-toggle:hover { background: rgba(255,255,255,.18); transform: scale(1.08); }
  #sound-toggle.muted { opacity: .55; }

  /* 麦克风录音学舌按钮特别样式 */
  #btn-mic {
    background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
    border: 1px solid rgba(255,255,255,.35) !important;
    color: #fff !important;
    font-weight: 600;
    box-shadow: 0 0 18px rgba(255,65,108,.55) !important;
    touch-action: none;
  }
  #btn-mic:hover { transform: translateY(-2px) scale(1.07) !important; box-shadow: 0 0 26px rgba(255,65,108,.75) !important; }
  #btn-mic.recording {
    background: linear-gradient(135deg, #d50000, #c51162) !important;
    box-shadow: 0 0 28px rgba(213,0,0,.95) !important;
    animation: mic-pulse .8s infinite alternate;
  }
  #btn-mic.mimicking {
    background: linear-gradient(135deg, #00c853, #00b0ff) !important;
    box-shadow: 0 0 24px rgba(0,200,83,.85) !important;
    animation: mic-pulse .6s infinite alternate;
  }
  @keyframes mic-pulse {
    0% { transform: scale(1); filter: brightness(1); }
    100% { transform: scale(1.08); filter: brightness(1.25); }
  }

  @media (max-width: 680px) {
    #panel-left { left: 10px; gap: 10px; }
    #panel-right { right: 10px; gap: 10px; }
    .side-panel button { padding: 9px 12px; font-size: 13px; border-radius: 11px; }
  }

  /* 击倒强震与眩晕小鸟 */
  #app.shake-hard { animation: shake-hard .55s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake-hard {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    15% { transform: translate(-12px, 8px) rotate(-2deg); }
    30% { transform: translate(11px, -9px) rotate(2deg); }
    45% { transform: translate(-9px, 6px) rotate(-1.2deg); }
    60% { transform: translate(7px, -5px) rotate(0.8deg); }
    75% { transform: translate(-4px, 3px) rotate(-0.5deg); }
    90% { transform: translate(2px, -2px) rotate(0.2deg); }
  }

  .dizzy-star {
    position: absolute; z-index: 35; pointer-events: none; font-size: 26px;
    animation: dizzy-orbit 1.4s linear infinite; will-change: transform;
  }
  @keyframes dizzy-orbit {
    0%   { transform: rotate(0deg) translateX(var(--radius, 60px)) rotate(0deg); }
    100% { transform: rotate(360deg) translateX(var(--radius, 60px)) rotate(-360deg); }
  }

</style>
</head>
<body>
<div id="app">
  <div id="title">
    <h1>🐱 会说话的汤姆猫</h1>
    <p>Three.js · GLB 模型 · 骨骼动画</p>
  </div>
  <div id="hint">🖱️ 连续打击会倒下 · 点击两侧按钮 · 【💃 跳舞】· 【🎙️ 学我说话】</div>
  <button id="sound-toggle" title="音效开关" aria-label="音效开关">🔊</button>
  <div id="bubble"></div>
  <div id="panel-left" class="side-panel"></div>
  <div id="panel-right" class="side-panel"></div>
  <div id="loader">
    <div class="paw">🐾</div>
    <div class="bar"><i id="bar-fill"></i></div>
    <div class="txt">正在加载汤姆猫模型...</div>
  </div>
</div>

function applyManualTextures(model) {
  const texLoader = new THREE.TextureLoader();
  Object.entries(TEX_B64).forEach(([name, b64]) => {
    if (!b64 || b64.startsWith('__')) return;
    texLoader.load('data:image/png;base64,' + b64, (tex) => {
      tex.flipY = false; // glTF UV 原点在左上
      tex.colorSpace = THREE.SRGBColorSpace;
      if (name === 'New_Material_1') tex.offset.set(1, 1); // 对应 KHR_texture_transform
      model.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => {
            if (m.name === name) {
              m.map = tex;
              m.needsUpdate = true;
            }
          });
        }
      });
    });
  });
}

/* 眼球结构修正：
   GLB 里 New_Material_2（corneas 角膜外层）没有 alphaMode/baseColorFactor，
   New_Material_1（上眼影）用的是一张近乎纯黑的贴图，两者在 Three.js 里都会被渲染成
   不透明的纯白/纯黑球壳，正好罩住 Blue_Eye 的绿色虹膜，所以眼睛看起来只有黑白。
   把这两层改成透明并关闭深度写入，让里面的绿色眼睛透出来（透明度保留一点高光/眼睑阴影）。 */
function fixEyeMaterials(model) {
  model.traverse((obj) => {
    if (!obj.isMesh || !obj.material) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    mats.forEach((m) => {
      if (m.name === 'New_Material_2') {
        m.transparent = true;
        m.opacity = 0.10;
        m.depthWrite = false;
        m.needsUpdate = true;
      } else if (m.name === 'New_Material_1') {
        m.transparent = true;
        m.opacity = 0.22;
        m.depthWrite = false;
        m.needsUpdate = true;
      }
    });
  });
}

/* 砖纹和挂画都用 canvas 程序化生成，不依赖外部图片，页面仍可单文件打开 */
function makeBrickTexture() {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 512;
  const g = cv.getContext('2d');
  g.fillStyle = '#241f1c';                       // 砖缝底色
  g.fillRect(0, 0, cv.width, cv.height);
  const bw = 128, bh = 64, gap = 5;
  for (let row = 0; row < 8; row++) {
    const shift = row % 2 ? -bw / 2 : 0;          // 错缝砌法
    for (let col = -1; col <= 8; col++) {
      const x = col * bw + shift, y = row * bh;
      const v = Math.random() * 16;
      const r = 66 + v, gg = 54 + v * 0.8, b = 47 + v * 0.65;
      const grad = g.createLinearGradient(x, y, x, y + bh - gap);
      grad.addColorStop(0, `rgb(${r + 12},${gg + 10},${b + 8})`);
      grad.addColorStop(1, `rgb(${r - 14},${gg - 14},${b - 13})`);
      g.fillStyle = grad;
      g.fillRect(x + gap / 2, y + gap / 2, bw - gap, bh - gap);
      for (let k = 0; k < 24; k++) {             // 砖面颗粒
        g.fillStyle = `rgba(0,0,0,${0.03 + Math.random() * 0.07})`;
        g.fillRect(x + 2 + Math.random() * (bw - 8), y + 2 + Math.random() * (bh - 8),
          2 + Math.random() * 5, 1 + Math.random() * 3);
      }
    }
  }
  const shade = g.createLinearGradient(0, 0, 0, cv.height);
  shade.addColorStop(0, 'rgba(0,0,0,0.12)');
  shade.addColorStop(0.45, 'rgba(0,0,0,0)');
  shade.addColorStop(1, 'rgba(0,0,0,0.5)');
  g.fillStyle = shade; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = 'rgba(12,14,18,0.26)';        // 整体压暗，避免背景抢主体
  g.fillRect(0, 0, cv.width, cv.height);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);                        // 还原砖块 2:1 的长宽比
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeWindowTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 384;
  const g = cv.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, cv.height);
  sky.addColorStop(0, '#0a1530');
  sky.addColorStop(0.6, '#1b2f55');
  sky.addColorStop(1, '#46577a');
  g.fillStyle = sky; g.fillRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < 80; i++) {                 // 星星
    g.fillStyle = `rgba(255,255,255,${0.25 + Math.random() * 0.7})`;
    const s = Math.random() * 1.6 + 0.4;
    g.fillRect(Math.random() * cv.width, Math.random() * 250, s, s);
  }
  g.fillStyle = '#f7f1d5';                       // 月亮
  g.beginPath(); g.arc(382, 86, 32, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0b1220';                       // 城市剪影
  for (let x = 0; x < cv.width; x += 26) {
    const h = 45 + Math.random() * 95;
    g.fillRect(x, cv.height - h, 22, h);
    for (let wy = cv.height - h + 8; wy < cv.height - 8; wy += 14) {
      if (Math.random() < 0.45) {
        g.fillStyle = 'rgba(255,205,120,0.75)';
        g.fillRect(x + 5, wy, 4, 5);
        g.fillStyle = '#0b1220';
      }
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const loader = new GLTFLoader();

let tomMeshes = [];

let baseModelPos = new THREE.Vector3();
let baseModelRot = new THREE.Euler();
let headBone = null;
let jawBone = null;

let baseJawRot = new THREE.Euler();
let isTomSpeaking = false;
let talkTimer = null;

// 跳舞与连续打击状态

loader.load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene;
    model.traverse((obj) => {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
        obj.frustumCulled = false; // 蒙皮网格防止被错误剔除
        tomMeshes.push(obj);
      }
    });

    // 自动居中与缩放：蒙皮模型的 geometry 包围盒不可靠（绑定姿势空间小、骨骼驱动实际尺寸大），
    // 这里改用骨骼世界坐标计算真实包围盒
    model.updateMatrixWorld(true);
    let box = new THREE.Box3();
    let hasBones = false;
    model.traverse((obj) => {
      if (obj.isBone) {
        box.expandByPoint(obj.getWorldPosition(new THREE.Vector3()));
        hasBones = true;
      }
    });
    if (!hasBones || !isFinite(box.min.x) || !isFinite(box.max.y)) {
      box.setFromObject(model); // 兜底：无骨骼信息时退回常规方式
    }
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    console.log('[Tom] 真实模型尺寸:', size.x.toFixed(1), size.y.toFixed(1), size.z.toFixed(1));
    const scale = 2.0 / Math.max(size.x, size.y, size.z, 0.001);
    model.scale.setScalar(scale);
    model.position.x -= center.x * scale;
    model.position.z -= center.z * scale;
    model.position.y -= box.min.y * scale;
    scene.add(model);
    tomModel = model; window.tomModel = model;
    baseModelPos.copy(model.position);
    baseModelRot.copy(model.rotation);
    if (headBone) baseHeadRot.copy(headBone.rotation);
    if (jawBone) baseJawRot.copy(jawBone.rotation);

    // 手动贴图兜底（GLTFLoader 内嵌贴图解码失败时保证有颜色）
    applyManualTextures(model);
    // 透出绿色虹膜（角膜/眼影在 glTF 里缺少透明信息，默认会挡住眼睛）
    fixEyeMaterials(model);

    // 动画
    animations = gltf.animations || [];
    if (animations.length) {
      mixer = new THREE.AnimationMixer(model);
      initIdleAnimations();
      buildPanels();
      playNextRandomIdle();
      scheduleNextIdleSwitch();
    } else {
      buildPanels();
    }

    // 加载完成
    document.getElementById('loader').classList.add('hide');
    setTimeout(() => document.getElementById('hint').classList.add('fade'), 6000);
  },
  (progress) => {
    if (progress.total) {
      barFill.style.width = Math.round(progress.loaded / progress.total * 100) + '%';
    }
  },
  (err) => {
    document.querySelector('#loader .txt').textContent = '❌ 模型加载失败：' + err.message;
    document.querySelector('#loader .paw').textContent = '😿';
    console.error(err);
  }
);

/* ---------- 动画控制与待机自动轮换系统 ---------- */
let idleAnimIndices = [];
let idleTimer = null;
let currentIdleIndex = -1;
let isBusyWithAction = false;

function initIdleAnimations() {
  idleAnimIndices = [];
  animations.forEach((clip, i) => {
    if (/idle|breathing/i.test(clip.name)) {
      idleAnimIndices.push(i);
    }
  });
  if (!idleAnimIndices.length && animations.length) {
    idleAnimIndices = [0];
  }
}

function playNextRandomIdle() {
  if (!idleAnimIndices.length) return;
  // 尽量选择与当前不同的待机动画
  let candidates = idleAnimIndices.filter(i => i !== currentIdleIndex);
  if (!candidates.length) candidates = idleAnimIndices;
  const picked = candidates[Math.floor(Math.random() * candidates.length)];
  currentIdleIndex = picked;
  playAnimation(picked);
}

function scheduleNextIdleSwitch() {
  clearTimeout(idleTimer);
  // 随机 5 ~ 8 秒自动变换一次待机动作，生动逼真
  const interval = 5000 + Math.random() * 3000;
  idleTimer = setTimeout(() => {
    if (!isBusyWithAction && !isTomSpeaking) {
      playNextRandomIdle();
    }
    scheduleNextIdleSwitch();
  }, interval);
}

function playAnimation(index) {
  if (!mixer || !animations[index]) return;
  const next = mixer.clipAction(animations[index]);
  if (currentAction === next) return;
  if (currentAction) {
    currentAction.fadeOut(0.4);
  }
  next.reset().fadeIn(0.4).play();
  currentAction = next;
}

/* ---------- 音效与语音系统（高调卡通猫音 + 麦克风变声学舌） ---------- */
let actx = null;
let sfxBus = null;        // 干声总线
let wetBus = null;        // 混响发送
let masterGain = null;
let noiseBuf = null;
let soundOn = true;

/** 生成衰减噪声作为简易混响脉冲响应，省去外部音频文件 */
function makeImpulse(ctx, seconds = 1.1, decay = 2.6) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

/** 复用噪声 buffer，避免每次交互都重新分配 */
function getNoiseBuffer(ctx, seconds = 0.5) {
  if (noiseBuf && noiseBuf.duration >= seconds) return noiseBuf;
  const len = Math.ceil(ctx.sampleRate * seconds);
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

function audioCtx() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();

    // 主链：各音效 -> 压缩器（防多音叠加爆音）-> 主音量 -> 输出
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 22;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.22;
    masterGain = actx.createGain();
    masterGain.gain.value = soundOn ? 0.75 : 0;
    comp.connect(masterGain).connect(actx.destination);

    // 少量并联混响，给合成音一点空间感
    const conv = actx.createConvolver();
    conv.buffer = makeImpulse(actx);
    wetBus = actx.createGain();
    wetBus.gain.value = 0.16;
    wetBus.connect(conv).connect(comp);

    sfxBus = actx.createGain();
    sfxBus.connect(comp);
    sfxBus.connect(wetBus);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

/** 指数包络，起音/收尾都留出余量，避免咔哒声和爆音 */
function ampEnv(gain, t, peak, attack, dur) {
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + Math.min(attack, dur / 3));
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}

/** 带滤波的噪声层，给合成音补上气声/摩擦质感 */
function noiseLayer(ctx, t, dur, { type = 'bandpass', freq = 900, q = 0.8, peak = 0.12 } = {}) {
  const src = ctx.createBufferSource();
  src.buffer = getNoiseBuffer(ctx, Math.max(dur, 0.5));
  const f = ctx.createBiquadFilter();
  f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain();
  ampEnv(g, t, peak, 0.012, dur);
  src.connect(f).connect(g).connect(sfxBus);
  src.start(t); src.stop(t + dur + 0.02);
}

const soundToggle = document.getElementById('sound-toggle');
soundToggle.addEventListener('click', () => {
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? '🔊' : '🔇';
  soundToggle.classList.toggle('muted', !soundOn);
  if (masterGain && actx) masterGain.gain.setTargetAtTime(soundOn ? 0.75 : 0, actx.currentTime, 0.02);
});

// 欢快跳舞舞曲节拍合成（低音鼓 + 踩镲 + 迪斯科旋律琶音）
function sfxDanceBeat(step = 0) {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;

  // 1. 动感低音底鼓 (Four-on-the-floor kick)
  const kick = ctx.createOscillator();
  kick.type = 'sine';
  kick.frequency.setValueAtTime(140, t0);
  kick.frequency.exponentialRampToValueAtTime(36, t0 + 0.12);
  const kickG = ctx.createGain();
  ampEnv(kickG, t0, 0.55, 0.003, 0.14);
  kick.connect(kickG).connect(sfxBus);
  kick.start(t0); kick.stop(t0 + 0.16);

  // 2. 踩镲 (Hi-hat)
  if (step % 2 === 1) {
    noiseLayer(ctx, t0, 0.05, { type: 'highpass', freq: 6500, q: 2, peak: 0.14 });
  }

  // 3. 旋律合成器琶音 (Disco Synth Bassline)
  const notes = [220, 261.6, 293.7, 329.6, 392.0, 440, 523.3, 587.3];
  const freq = notes[step % notes.length];
  const synth = ctx.createOscillator();
  synth.type = (step % 4 === 0) ? 'sawtooth' : 'triangle';
  synth.frequency.setValueAtTime(freq, t0);
  const synthFilt = ctx.createBiquadFilter();
  synthFilt.type = 'lowpass';
  synthFilt.frequency.setValueAtTime(1600, t0);
  synthFilt.frequency.exponentialRampToValueAtTime(500, t0 + 0.18);
  const synthG = ctx.createGain();
  ampEnv(synthG, t0, 0.32, 0.01, 0.2);
  synth.connect(synthFilt).connect(synthG).connect(sfxBus);
  synth.start(t0); synth.stop(t0 + 0.22);
}

// 眩晕小哨音
function sfxDizzy() {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1150, t0);
  osc.frequency.exponentialRampToValueAtTime(260, t0 + 0.55);

  const lfo = ctx.createOscillator();
  lfo.frequency.setValueAtTime(20, t0);
  const lg = ctx.createGain();
  lg.gain.setValueAtTime(60, t0);
  lfo.connect(lg).connect(osc.frequency);

  const g = ctx.createGain();
  ampEnv(g, t0, 0.38, 0.01, 0.55);
  osc.connect(g).connect(sfxBus);
  osc.start(t0); osc.stop(t0 + 0.58);
  lfo.start(t0); lfo.stop(t0 + 0.58);
}

// 摔倒巨响 (Duang! Boom!)
function sfxBodySlam() {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;

  // 超重低音撞击
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, t0);
  osc.frequency.exponentialRampToValueAtTime(25, t0 + 0.35);
  const g = ctx.createGain();
  ampEnv(g, t0, 0.85, 0.002, 0.4);
  osc.connect(g).connect(sfxBus);
  osc.start(t0); osc.stop(t0 + 0.45);

  // 身体拍击地面噪声
  noiseLayer(ctx, t0, 0.22, { type: 'lowpass', freq: 700, q: 1.2, peak: 0.45 });

  // 弹簧回弹滑稽音
  const boing = ctx.createOscillator();
  boing.type = 'triangle';
  boing.frequency.setValueAtTime(320, t0 + 0.06);
  boing.frequency.exponentialRampToValueAtTime(75, t0 + 0.32);
  const bg = ctx.createGain();
  ampEnv(bg, t0 + 0.06, 0.32, 0.01, 0.28);
  boing.connect(bg).connect(sfxBus);
  boing.start(t0 + 0.06); boing.stop(t0 + 0.36);
}

// 倒地时小鸟叽叽喳喳叫
function sfxBirdChirp() {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;
  for (let i = 0; i < 2; i++) {
    const t = t0 + i * 0.14;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2200, t);
    osc.frequency.exponentialRampToValueAtTime(3100, t + 0.05);
    osc.frequency.exponentialRampToValueAtTime(2400, t + 0.1);
    const g = ctx.createGain();
    ampEnv(g, t, 0.18, 0.01, 0.1);
    osc.connect(g).connect(sfxBus);
    osc.start(t); osc.stop(t + 0.12);
  }
}

// 倒地时被戳的微弱哼唧
function sfxGroan() {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(340, t0);
  osc.frequency.exponentialRampToValueAtTime(180, t0 + 0.25);
  const g = ctx.createGain();
  ampEnv(g, t0, 0.3, 0.02, 0.25);
  osc.connect(g).connect(sfxBus);
  osc.start(t0); osc.stop(t0 + 0.28);
}


// 汤姆猫卡通猫叫合成（高频俏皮调频，模拟 "喵呜～" 与 "咪喵！"）
function sfxTomMeow(kind = 0) {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;

  if (kind === 0) {
    // 经典 "喵呜～" (高音上扬再柔和下滑，基频 620~1020Hz)
    const dur = 0.52;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(620, t0);
    osc.frequency.exponentialRampToValueAtTime(1020, t0 + 0.14);
    osc.frequency.exponentialRampToValueAtTime(740, t0 + dur);

    // FM 调制波增加喉咙震颤
    const mod = ctx.createOscillator();
    mod.type = 'triangle';
    mod.frequency.setValueAtTime(130, t0);
    mod.frequency.linearRampToValueAtTime(90, t0 + dur);
    const mg = ctx.createGain();
    mg.gain.setValueAtTime(55, t0);
    mg.gain.linearRampToValueAtTime(15, t0 + dur);
    mod.connect(mg).connect(osc.frequency);

    const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 1150; f1.Q.value = 4.2;
    const f2 = ctx.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 2700; f2.Q.value = 5.0;
    const g1 = ctx.createGain(); g1.gain.value = 0.85;
    const g2 = ctx.createGain(); g2.gain.value = 0.45;
    const g = ctx.createGain();
    ampEnv(g, t0, 0.48, 0.035, dur);

    osc.connect(f1).connect(g1).connect(g);
    osc.connect(f2).connect(g2).connect(g);
    g.connect(sfxBus);

    osc.start(t0); osc.stop(t0 + dur + 0.02);
    mod.start(t0); mod.stop(t0 + dur + 0.02);
    noiseLayer(ctx, t0 + 0.02, 0.15, { freq: 2400, q: 1.2, peak: 0.04 });
  } else {
    // 活泼俏皮的连续两声 "咪喵！"
    const notes = [
      { f0: 780, f1: 1080, dur: 0.18, wait: 0 },
      { f0: 640, f1: 1180, dur: 0.32, wait: 0.22 }
    ];
    notes.forEach(n => {
      const t = t0 + n.wait;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(n.f0, t);
      osc.frequency.exponentialRampToValueAtTime(n.f1, t + n.dur * 0.6);
      osc.frequency.exponentialRampToValueAtTime(n.f0 * 1.05, t + n.dur);

      const mod = ctx.createOscillator();
      mod.type = 'sawtooth';
      mod.frequency.setValueAtTime(160, t);
      const mg = ctx.createGain();
      mg.gain.value = 40;
      mod.connect(mg).connect(osc.frequency);

      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 3.5;
      const g = ctx.createGain();
      ampEnv(g, t, 0.42, 0.02, n.dur);

      osc.connect(f).connect(g).connect(sfxBus);
      osc.start(t); osc.stop(t + n.dur + 0.02);
      mod.start(t); mod.stop(t + n.dur + 0.02);
    });
  }
}

// 喝牛奶：吞咽下滑音 + 液体气泡噪声 + 满足的叹气
function sfxMilk() {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;
  for (let i = 0; i < 4; i++) {
    const t = t0 + i * 0.28;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320 - i * 22, t);
    osc.frequency.exponentialRampToValueAtTime(85, t + 0.14);
    const g = ctx.createGain();
    ampEnv(g, t, 0.42, 0.015, 0.17);
    osc.connect(g).connect(sfxBus);
    osc.start(t); osc.stop(t + 0.2);
    noiseLayer(ctx, t + 0.01, 0.09, { freq: 480 + i * 60, q: 3, peak: 0.05 });
  }
  const t1 = t0 + 1.25;
  const o2 = ctx.createOscillator();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(360, t1);
  o2.frequency.exponentialRampToValueAtTime(190, t1 + 0.5);
  const f2 = ctx.createBiquadFilter();
  f2.type = 'lowpass'; f2.frequency.value = 1100;
  const g2 = ctx.createGain();
  ampEnv(g2, t1, 0.16, 0.08, 0.62);
  o2.connect(f2).connect(g2).connect(sfxBus);
  o2.start(t1); o2.stop(t1 + 0.66);
  noiseLayer(ctx, t1, 0.55, { freq: 900, q: 0.6, peak: 0.03 });
}

// 放屁：低频颤音 + 滤波扫频 + 气流噪声，收尾更软
function sfxFart() {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;
  const dur = 0.45 + Math.random() * 0.45;
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  let t = t0;
  while (t < t0 + dur) {
    osc.frequency.setValueAtTime(48 + Math.random() * 55, t);
    t += 0.035 + Math.random() * 0.04;
  }
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 15 + Math.random() * 14;
  const lfoG = ctx.createGain(); lfoG.gain.value = 26;
  lfo.connect(lfoG).connect(osc.frequency);
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass'; filt.Q.value = 4;
  filt.frequency.setValueAtTime(420, t0);
  filt.frequency.exponentialRampToValueAtTime(160, t0 + dur);
  const g = ctx.createGain();
  ampEnv(g, t0, 0.42, 0.035, dur);
  osc.connect(filt).connect(g).connect(sfxBus);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
  lfo.start(t0); lfo.stop(t0 + dur + 0.02);
  noiseLayer(ctx, t0, dur, { type: 'lowpass', freq: 260, q: 0.8, peak: 0.1 });
}

// 恶搞"boing"：主音 + 金属泛音 + 频率颤动
function sfxBoing() {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;
  const mk = (type, f0, f1, peak, dur, detune = 0) => {
    const o = ctx.createOscillator();
    o.type = type;
    o.detune.value = detune;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.8);
    const g = ctx.createGain();
    ampEnv(g, t0, peak, 0.008, dur);
    o.connect(g).connect(sfxBus);
    o.start(t0); o.stop(t0 + dur + 0.02);
    return o;
  };
  const main = mk('triangle', 620, 105, 0.3, 0.62);
  mk('sine', 1240, 210, 0.09, 0.42, 6);
  const lfo = ctx.createOscillator(); lfo.frequency.value = 22;
  const lg = ctx.createGain(); lg.gain.value = 55;
  lfo.connect(lg).connect(main.frequency);
  lfo.start(t0); lfo.stop(t0 + 0.65);
}

// 被打：清脆击打 + 标志性高亢滑稽惨叫 "嗷呜——！"
function sfxHit() {
  const ctx = audioCtx();
  const t0 = ctx.currentTime + 0.01;

  // 1. 重击拍打声
  const punch = ctx.createOscillator();
  punch.type = 'sine';
  punch.frequency.setValueAtTime(220, t0);
  punch.frequency.exponentialRampToValueAtTime(38, t0 + 0.12);
  const punchG = ctx.createGain();
  ampEnv(punchG, t0, 0.65, 0.003, 0.15);
  punch.connect(punchG).connect(sfxBus);
  punch.start(t0); punch.stop(t0 + 0.18);
  noiseLayer(ctx, t0, 0.1, { type: 'bandpass', freq: 1400, q: 1.5, peak: 0.32 });

  // 2. 汤姆猫高亢尖叫：720Hz 骤冲 1420Hz 然后急坠至 380Hz，伴随 22Hz 滑稽破音颤抖
  const tVoice = t0 + 0.06;
  const screamDur = 0.46;
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(720, tVoice);
  osc.frequency.exponentialRampToValueAtTime(1420, tVoice + 0.11);
  osc.frequency.exponentialRampToValueAtTime(360, tVoice + screamDur);

  const lfo = ctx.createOscillator();
  lfo.frequency.setValueAtTime(22, tVoice);
  const lfoG = ctx.createGain();
  lfoG.gain.setValueAtTime(65, tVoice);
  lfo.connect(lfoG).connect(osc.frequency);

  const filt = ctx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.setValueAtTime(1600, tVoice);
  filt.Q.value = 3.0;

  const g = ctx.createGain();
  ampEnv(g, tVoice, 0.48, 0.02, screamDur);

  osc.connect(filt).connect(g).connect(sfxBus);
  osc.start(tVoice); osc.stop(tVoice + screamDur + 0.02);
  lfo.start(tVoice); lfo.stop(tVoice + screamDur + 0.02);
  noiseLayer(ctx, tVoice, 0.22, { type: 'bandpass', freq: 2800, q: 2, peak: 0.06 });
}

/* ---------- 汤姆猫变声学舌系统（经典 Outfit7 变调算法） ---------- */
function trimSilence(ctx, buf, threshold = 0.015) {
  const data = buf.getChannelData(0);
  let start = 0;
  let end = data.length - 1;
  while (start < end && Math.abs(data[start]) < threshold) start++;
  while (end > start && Math.abs(data[end]) < threshold) end--;

  const pad = Math.floor(ctx.sampleRate * 0.05);
  start = Math.max(0, start - pad);
  end = Math.min(data.length, end + pad);

  const len = end - start;
  if (len <= pad * 2) return null;

  const newBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  newBuf.copyToChannel(data.subarray(start, end), 0);
  return newBuf;
}

let activePlaybackNode = null;
function playTomMimic(audioBuf, onEnd) {
  const ctx = audioCtx();
  const trimmed = trimSilence(ctx, audioBuf);
  if (!trimmed || trimmed.duration < 0.25) {
    showBubble('喵？好像没听清，离麦克风近一点再对我说一句吧！', 2500);
    if (onEnd) onEnd();
    return;
  }

  if (activePlaybackNode) {
    try { activePlaybackNode.stop(); } catch(e){}
    activePlaybackNode = null;
  }

  const src = ctx.createBufferSource();
  src.buffer = trimmed;
  // 经典汤姆猫变调：1.54x 升调与语速加速（花栗鼠效果）
  src.playbackRate.value = 1.54;

  // 滤波器：高通 220Hz 削减沉闷低频，峰值滤波 2700Hz 增强小猫清脆卡通共鸣
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 220;

  const peak = ctx.createBiquadFilter();
  peak.type = 'peaking';
  peak.frequency.value = 2700;
  peak.Q.value = 1.6;
  peak.gain.value = 4.5;

  const g = ctx.createGain();
  g.gain.value = 1.35;

  src.connect(hp).connect(peak).connect(g).connect(sfxBus);

  const playDuration = trimmed.duration / 1.54;
  showBubble('😸 汤姆猫正在学你说话...', Math.round(playDuration * 1000) + 600);
  triggerTalkAction(playDuration);

  src.onended = () => {
    isTomSpeaking = false;
    showBubble('嘻嘻，我学得像不像？按住再试试～', 2200);
    playRandomIdle();
    activePlaybackNode = null;
    if (onEnd) onEnd();
  };

  activePlaybackNode = src;
  src.start();
}

function setupMicButton(panel) {
  const btn = document.createElement('button');
  btn.id = 'btn-mic';
  btn.className = 'btn-mic';
  btn.title = '按住说话或点击开启倾听';
  btn.innerHTML = '<span class="mic-icon">🎙️</span><span class="mic-txt">学我说话</span>';
  panel.appendChild(btn);

  let isRecording = false;
  let recordStartTime = 0;
  let micStream = null;
  let scriptNode = null;
  let sourceNode = null;
  let audioChunks = [];
  let silenceStart = 0;
  let maxTimer = null;
  let dummyGain = null;

  async function startRecording() {
    if (isRecording || isTomSpeaking) return;
    const ctx = audioCtx();

    try {
      if (!micStream || !micStream.active) {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
      }
    } catch (err) {
      console.warn('Microphone permission error:', err);
      showBubble('🎤 麦克风无法访问，汤姆猫为你表演原声台词喵～', 2600);
      doTalk();
      return;
    }

    audioChunks = [];
    isRecording = true;
    recordStartTime = performance.now();
    silenceStart = 0;

    sourceNode = ctx.createMediaStreamSource(micStream);
    scriptNode = ctx.createScriptProcessor(2048, 1, 1);

    scriptNode.onaudioprocess = (e) => {
      if (!isRecording) return;
      const input = e.inputBuffer.getChannelData(0);
      audioChunks.push(new Float32Array(input));

      // 清空输出缓冲，彻底防止啸叫和回声
      const output = e.outputBuffer.getChannelData(0);
      output.fill(0);

      // RMS 计算检测静音
      let sum = 0;
      for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
      const rms = Math.sqrt(sum / input.length);

      const now = performance.now();
      if (now - recordStartTime > 1200) {
        if (rms < 0.015) {
          if (!silenceStart) silenceStart = now;
          else if (now - silenceStart > 1100) {
            stopRecordingAndRepeat();
          }
        } else {
          silenceStart = 0;
        }
      }
    };

    dummyGain = ctx.createGain();
    dummyGain.gain.value = 0;
    sourceNode.connect(scriptNode);
    scriptNode.connect(dummyGain);
    dummyGain.connect(ctx.destination);

    btn.classList.add('recording');
    btn.innerHTML = '<span class="mic-icon">🔴</span><span class="mic-txt">倾听中...</span>';
    showBubble('👂 倾听中... 对我说话吧！', 8000);
    playRandomIdle();

    clearTimeout(maxTimer);
    maxTimer = setTimeout(() => {
      if (isRecording) stopRecordingAndRepeat();
    }, 8500);
  }

  function stopRecordingAndRepeat() {
    if (!isRecording) return;
    isRecording = false;
    clearTimeout(maxTimer);

    btn.classList.remove('recording');
    btn.classList.add('mimicking');
    btn.innerHTML = '<span class="mic-icon">😸</span><span class="mic-txt">复述中...</span>';

    if (scriptNode) {
      try { scriptNode.disconnect(); } catch(e){}
      scriptNode = null;
    }
    if (sourceNode) {
      try { sourceNode.disconnect(); } catch(e){}
      sourceNode = null;
    }
    if (dummyGain) {
      try { dummyGain.disconnect(); } catch(e){}
      dummyGain = null;
    }

    const duration = performance.now() - recordStartTime;
    if (duration < 350 || audioChunks.length === 0) {
      btn.classList.remove('mimicking');
      btn.innerHTML = '<span class="mic-icon">🎙️</span><span class="mic-txt">学我说话</span>';
      showBubble('喵？录音太短啦，按住多对我说两句吧！', 2200);
      return;
    }

    const ctx = audioCtx();
    let totalLen = 0;
    for (const chunk of audioChunks) totalLen += chunk.length;
    const merged = new Float32Array(totalLen);
    let offset = 0;
    for (const chunk of audioChunks) {
      merged.set(chunk, offset);
      offset += chunk.length;
    }

    const audioBuf = ctx.createBuffer(1, totalLen, ctx.sampleRate);
    audioBuf.copyToChannel(merged, 0);

    playTomMimic(audioBuf, () => {
      btn.classList.remove('mimicking');
      btn.innerHTML = '<span class="mic-icon">🎙️</span><span class="mic-txt">学我说话</span>';
    });
  }

  let pointerDownTime = 0;
  let isPointerDown = false;

  btn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    pointerDownTime = performance.now();
    isPointerDown = true;
    if (!isRecording) {
      startRecording();
    }
  });

  window.addEventListener('pointerup', () => {
    if (!isPointerDown) return;
    isPointerDown = false;
    const elapsed = performance.now() - pointerDownTime;
    if (elapsed > 400 && isRecording) {
      stopRecordingAndRepeat();
    }
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const elapsed = performance.now() - pointerDownTime;
    if (elapsed <= 400 && isRecording) {
      stopRecordingAndRepeat();
    }
  });
}

  sfxDizzy();
  showBubble('哎呀呀～眼冒金星了！😵💫', 1400);

  // 阶段 2：向后摔倒 (0.35秒)
  kdTimers.push(setTimeout(() => {
    knockdownPhase = 'falling';
    knockdownTimer = performance.now();
    sfxBodySlam();
    const app = document.getElementById('app');
    app.classList.remove('shake-hard');
    void app.offsetWidth;
    app.classList.add('shake-hard');
    setTimeout(() => app.classList.remove('shake-hard'), 600);

    // 阶段 3：倒地不起 (1.8秒)
    kdTimers.push(setTimeout(() => {
      knockdownPhase = 'flat';
      showBubble('呜呜…起不来了…😵💫', 1800);
      sfxBirdChirp();

      // 阶段 4：爬起来恢复 (0.65秒)
      kdTimers.push(setTimeout(() => {
        clearDizzyStars();
        knockdownPhase = 'getting_up';
        knockdownTimer = performance.now();

        kdTimers.push(setTimeout(() => {
          // 彻底恢复归位
          knockdownPhase = 'none';
          isKnockedDown = false;
          if (tomModel) {
            tomModel.position.copy(baseModelPos);
            tomModel.rotation.copy(baseModelRot);
          }
          if (headBone) headBone.rotation.copy(baseHeadRot);
          if (jawBone) jawBone.rotation.copy(baseJawRot);

          showBubble('好汉不吃眼前亏，别再打啦喵！😼', 2000);
          sfxTomMeow(0);
          isBusyWithAction = false;
          playNextRandomIdle();
          scheduleNextIdleSwitch();
        }, 650));
      }, 1800));
    }, 350));
  }, 400));
}

function doMilk() {
  sfxMilk();
  const idx = findAnimByPattern(/specialFood/i);
  isBusyWithAction = true;
  clearTimeout(idleTimer);

  if (idx !== null) playAnimation(idx);
  else playNextRandomIdle();

  showBubble('咕咚咕咚…🥛 好喝！', 2400);

  setTimeout(() => {
    isBusyWithAction = false;
    playNextRandomIdle();
    scheduleNextIdleSwitch();
  }, 2600);
}

function doSpicy() {
  const idx = findAnimByPattern(/spicy|specialFood/i);
  isBusyWithAction = true;
  clearTimeout(idleTimer);

  if (idx !== null) playAnimation(idx);
  else playNextRandomIdle();

  sfxBoing();
  showBubble('好辣好辣！🌶️🔥 呼呼呼～！', 3200);

}

function doFart() {
  sfxFart();
  showBubble('噗～～💨', 1400);
  isBusyWithAction = true;
  clearTimeout(idleTimer);
  setTimeout(() => {
    isBusyWithAction = false;

}

function doPrank() {
  const r = Math.random();
  if (r < 0.34) { sfxBoing(); showBubble('Boing～弹起来！'); }
  else if (r < 0.67) { doFart(); }
  else {
    sfxTomMeow(1);
    showBubble('啦啦啦～🎵 喵喵喵 喵！', 2400);
  }
  isBusyWithAction = true;
  clearTimeout(idleTimer);
  if (animations.length) {
    const specialIdx = findAnimByPattern(/specialFood|Action3|Action4/i);
    if (specialIdx !== null) playAnimation(specialIdx);
  }
  setTimeout(() => {
    isBusyWithAction = false;
    playNextRandomIdle();
    scheduleNextIdleSwitch();
  }, 2600);
}

/* ---------- 点击猫咪：被打与连击倒下效果 ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let clickCooldown = 0;
let downPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.abs(e.clientX - downPos.x) + Math.abs(e.clientY - downPos.y);
  downPos = null;
  if (moved > 6) return;

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(tomMeshes, false);

  if (hits.length && performance.now() > clickCooldown) {
    clickCooldown = performance.now() + 140; // 冷却缩短至140ms
    const now = performance.now();

    // 如果当前正处于倒地状态，点击触发哀鸣呻吟
    if (isKnockedDown) {
      sfxGroan();
      spawnHitFx(e.clientX, e.clientY);
      showBubble('别戳啦…疼死喵了…🤕', 1000);
      return;
    }

    // 连击检测：2.0 秒内连续打 3 次触发击倒
    if (now - lastHitTime < 2000) {
      comboHits++;
    } else {
      comboHits = 1;
    }
    lastHitTime = now;

    if (comboHits >= 3) {
      comboHits = 0;
      spawnHitFx(e.clientX, e.clientY);
      triggerKnockdown();
    } else {
      sfxHit();
      spawnHitFx(e.clientX, e.clientY);
      const text = HIT_TEXTS[Math.floor(Math.random() * HIT_TEXTS.length)] + ' (' + comboHits + '/3)';
      showBubble(text, 1000);
      isBusyWithAction = true;
      clearTimeout(idleTimer);
      playNextRandomIdle();
      setTimeout(() => {
        if (!isKnockedDown && !isDancing) {
          isBusyWithAction = false;
          scheduleNextIdleSwitch();
        }
      }, 1200);
    }
  }
});

window.doDance = doDance;
window.triggerKnockdown = triggerKnockdown;

/* ---------- 渲染循环 ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);

  const t = clock.getElapsedTime();

  // 1. 跳舞：节拍上下弹跳与节奏律动 (绝对赋值，禁止累加)
  if (isDancing && tomModel) {
    const dtDance = (performance.now() - danceStartTime) * 0.001;
    tomModel.position.y = baseModelPos.y + Math.abs(Math.sin(dtDance * 7)) * 0.12;
    tomModel.position.x = baseModelPos.x + Math.sin(dtDance * 3.5) * 0.1;
    tomModel.rotation.z = baseModelRot.z + Math.sin(dtDance * 3.5) * 0.12;
    tomModel.rotation.y = baseModelRot.y + Math.sin(dtDance * 7) * 0.14;
    if (headBone) headBone.rotation.z = baseHeadRot.z + Math.sin(dtDance * 7) * 0.15;
    if (jawBone) jawBone.rotation.x = baseJawRot.x + Math.max(0, Math.sin(dtDance * 14)) * 0.15;
    if (wallGlow) wallGlow.color.setHSL((dtDance * 0.6) % 1, 0.95, 0.6);
  }
  // 2. 连续打击倒下动画：眩晕晃动 -> 摔倒倒地 -> 躺平抽搐 -> 爬起恢复
  else if (isKnockedDown && tomModel) {
    if (knockdownPhase === 'dizzy') {
      const elapsed = (performance.now() - knockdownTimer) * 0.001;
      tomModel.rotation.z = baseModelRot.z + Math.sin(elapsed * 14) * 0.18;
      tomModel.rotation.x = baseModelRot.x;
      if (headBone) headBone.rotation.y = baseHeadRot.y + Math.sin(elapsed * 16) * 0.22;
    } else if (knockdownPhase === 'falling') {
      const p = Math.min(1, (performance.now() - knockdownTimer) / 350);
      const ease = p * p;
      tomModel.rotation.z = baseModelRot.z;
      tomModel.rotation.x = baseModelRot.x - (Math.PI / 2) * ease;
      tomModel.position.y = THREE.MathUtils.lerp(baseModelPos.y, baseModelPos.y + 0.15, ease);
      tomModel.position.z = THREE.MathUtils.lerp(baseModelPos.z, baseModelPos.z - 0.25, ease);
      if (headBone) headBone.rotation.copy(baseHeadRot);
    } else if (knockdownPhase === 'flat') {
      tomModel.rotation.z = baseModelRot.z;
      tomModel.rotation.x = baseModelRot.x - Math.PI / 2;
      tomModel.position.y = baseModelPos.y + 0.15 + Math.sin(t * 2.5) * 0.012;
      tomModel.position.z = baseModelPos.z - 0.25;
      if (headBone) headBone.rotation.copy(baseHeadRot);
    } else if (knockdownPhase === 'getting_up') {
      const p = Math.min(1, (performance.now() - knockdownTimer) / 650);
      const ease = 0.5 - Math.cos(p * Math.PI) / 2;
      tomModel.rotation.z = baseModelRot.z;
      tomModel.rotation.x = THREE.MathUtils.lerp(baseModelRot.x - Math.PI / 2, baseModelRot.x, ease);
      tomModel.position.y = THREE.MathUtils.lerp(baseModelPos.y + 0.15, baseModelPos.y, ease);
      tomModel.position.z = THREE.MathUtils.lerp(baseModelPos.z - 0.25, baseModelPos.z, ease);
      if (headBone) headBone.rotation.copy(baseHeadRot);
    }
  }
  // 3. 常态：绝对归位，杜绝任何持续晃动！
  else if (tomModel) {
    tomModel.position.copy(baseModelPos);
    tomModel.rotation.copy(baseModelRot);
    if (headBone) headBone.rotation.copy(baseHeadRot);
    if (isTomSpeaking && jawBone) {
      jawBone.rotation.x = baseJawRot.x + Math.max(0, Math.sin(t * 16)) * 0.12;
    } else if (jawBone) {
      jawBone.rotation.copy(baseJawRot);
    }
  }

  ring.rotation.z += dt * 0.3;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
